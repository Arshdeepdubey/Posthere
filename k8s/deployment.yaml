apiVersion: v1
kind: Namespace
metadata:
  name: posthere

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: posthere-app
  namespace: posthere
  labels:
    app: posthere
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: posthere
  template:
    metadata:
      labels:
        app: posthere
    spec:
      containers:
      - name: posthere
        image: posthere:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m"
        
        # Liveness Probe - checks if the container is still running
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness Probe - checks if the container is ready to receive traffic
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Startup Probe - checks if the application has started
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: posthere-service
  namespace: posthere
  labels:
    app: posthere
spec:
  selector:
    app: posthere
  type: LoadBalancer
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
    name: http

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: posthere-hpa
  namespace: posthere
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: posthere-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
